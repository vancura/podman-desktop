name: Sync extension schema to SchemaStore

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.28.2)'
        required: true
      schemastore_repository:
        description: 'SchemaStore repository to update (owner/repo)'
        required: false
        default: 'SchemaStore/schemastore'
      schemastore_base_branch:
        description: 'Base branch in the SchemaStore repository'
        required: false
        default: 'master'
      create_pr:
        description: 'Create a pull request after pushing the branch'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      schemaMinorVersion: ${{ steps.version.outputs.schemaMinorVersion }}
      isOfficialRelease: ${{ steps.version.outputs.isOfficialRelease }}
    steps:
      - name: Resolve tag and release type
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${{ github.event.release.prerelease }}" = "true" ] || [ "${{ github.event.release.draft }}" = "true" ]; then
              echo "Skipping prerelease/draft release."
              echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          IS_OFFICIAL_RELEASE="true"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag '$TAG'. Expected stable semver format: v<major>.<minor>.<patch>."
            echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          SCHEMA_MINOR_VERSION="${MAJOR}.${MINOR}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "schemaMinorVersion=${SCHEMA_MINOR_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "isOfficialRelease=${IS_OFFICIAL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved schema source tag: ${TAG}"

  sync-schemastore:
    name: Sync schema to SchemaStore
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.isOfficialRelease == 'true'
    environment: ${{ github.event_name == 'release' && 'npmjs-publication' || '' }}
    permissions:
      contents: read
    env:
      SCHEMASTORE_TOKEN: ${{ secrets.PODMAN_DESKTOP_BOT_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SCHEMA_MINOR_VERSION: ${{ needs.prepare.outputs.schemaMinorVersion }}
      SCHEMA_FILE_NAME: podman-desktop-extension.json
      VERSIONED_SCHEMA_FILE_NAME: podman-desktop-extension-${{ needs.prepare.outputs.schemaMinorVersion }}.json
      SCHEMASTORE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_repository || 'SchemaStore/schemastore' }}
      SCHEMASTORE_BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_base_branch || 'master' }}
      CREATE_PR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_pr || 'true' }}
      SOURCE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.repository || 'podman-desktop/podman-desktop' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate local schema file exists
        run: |
          if [ ! -f "schemas/extension-schema.json" ]; then
            echo "Missing schemas/extension-schema.json in release tag ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout SchemaStore repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SCHEMASTORE_REPOSITORY }}
          token: ${{ env.SCHEMASTORE_TOKEN }}
          path: schemastore
          ref: ${{ env.SCHEMASTORE_BASE_BRANCH }}

      - name: Apply schema updates
        working-directory: schemastore
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const schemaDir = path.join('src', 'schemas', 'json');
          const stableFile = path.join(schemaDir, process.env.SCHEMA_FILE_NAME);
          const versionedFile = path.join(schemaDir, process.env.VERSIONED_SCHEMA_FILE_NAME);
          const incomingFile = path.join('..', 'schemas', 'extension-schema.json');
          const packageSchemaFile = path.join(schemaDir, 'package.json');
          const catalogFile = path.join('src', 'api', 'json', 'catalog.json');
          const schemaMinorVersion = process.env.SCHEMA_MINOR_VERSION;
          const stableUrl = `https://www.schemastore.org/${process.env.SCHEMA_FILE_NAME}`;
          const versionedUrl = `https://www.schemastore.org/${process.env.VERSIONED_SCHEMA_FILE_NAME}`;
          const versionedId = `https://json.schemastore.org/${process.env.VERSIONED_SCHEMA_FILE_NAME}`;
          const packageSchemaRef = 'https://json.schemastore.org/package.json';

          if (!fs.existsSync(incomingFile)) {
            throw new Error(`Missing source schema at ${incomingFile}`);
          }

          function inlinePackageSchema(node, packageSchema) {
            if (Array.isArray(node)) {
              return node.map(item => inlinePackageSchema(item, packageSchema));
            }
            if (node && typeof node === 'object') {
              if (node.$ref === packageSchemaRef) {
                return packageSchema;
              }
              const next = {};
              for (const [key, value] of Object.entries(node)) {
                next[key] = inlinePackageSchema(value, packageSchema);
              }
              return next;
            }
            return node;
          }

          function findObjectBounds(text, startIndex) {
            let inString = false;
            let escaped = false;
            let depth = 0;
            let end = -1;

            for (let i = startIndex; i < text.length; i++) {
              const ch = text[i];
              if (inString) {
                if (escaped) {
                  escaped = false;
                } else if (ch === '\\\\') {
                  escaped = true;
                } else if (ch === '"') {
                  inString = false;
                }
                continue;
              }

              if (ch === '"') {
                inString = true;
              } else if (ch === '{') {
                depth += 1;
              } else if (ch === '}') {
                depth -= 1;
                if (depth === 0) {
                  end = i;
                  break;
                }
              }
            }

            if (end === -1) {
              throw new Error('Could not locate end of JSON object');
            }
            return { start: startIndex, end };
          }

          function ensureTopLevelId(text, schemaId) {
            return text.replace(
              /^(\{\n\s*"\$schema"\s*:\s*"[^"]+",\n)(\s*"\$id"\s*:\s*"[^"]+",\n)?/,
              (_match, schemaLine) => `${schemaLine}  "$id": "${schemaId}",\n`,
            );
          }

          const incomingText = fs.readFileSync(incomingFile, 'utf8');
          let stableSchemaText = incomingText;
          if (incomingText.includes(packageSchemaRef)) {
            const incomingSchema = JSON.parse(incomingText);
            const packageSchema = JSON.parse(fs.readFileSync(packageSchemaFile, 'utf8'));
            const stableSchema = inlinePackageSchema(incomingSchema, packageSchema);
            stableSchemaText = `${JSON.stringify(stableSchema, null, 2)}\n`;
          }

          const stableId = `https://json.schemastore.org/${process.env.SCHEMA_FILE_NAME}`;
          stableSchemaText = ensureTopLevelId(stableSchemaText, stableId);
          fs.writeFileSync(stableFile, stableSchemaText, 'utf8');
          const versionedSchemaText = ensureTopLevelId(stableSchemaText, versionedId);
          fs.writeFileSync(versionedFile, versionedSchemaText, 'utf8');

          const catalogText = fs.readFileSync(catalogFile, 'utf8');
          const marker = '"name": "Podman Desktop Extension"';
          const markerIndex = catalogText.indexOf(marker);
          if (markerIndex === -1) {
            throw new Error('Podman Desktop catalog entry is missing in SchemaStore.');
          }

          const objectStart = catalogText.lastIndexOf('{', markerIndex);
          if (objectStart === -1) {
            throw new Error('Could not locate start of Podman Desktop catalog object.');
          }

          const { end: objectEnd } = findObjectBounds(catalogText, objectStart);
          const podmanBlock = catalogText.slice(objectStart, objectEnd + 1);
          const podmanEntry = JSON.parse(podmanBlock);

          podmanEntry.url = stableUrl;
          if (!podmanEntry.versions || typeof podmanEntry.versions !== 'object') {
            podmanEntry.versions = {};
          }
          podmanEntry.versions[schemaMinorVersion] = versionedUrl;

          const lineStart = catalogText.lastIndexOf('\n', objectStart) + 1;
          const blockIndent = catalogText.slice(lineStart, objectStart);
          const updatedBlock = JSON.stringify(podmanEntry, null, 2)
            .split('\n')
            .map((line, index) => {
              if (line.length === 0) return line;
              return index === 0 ? line : `${blockIndent}${line}`;
            })
            .join('\n');

          const updatedCatalog = `${catalogText.slice(0, objectStart)}${updatedBlock}${catalogText.slice(objectEnd + 1)}`;
          fs.writeFileSync(catalogFile, updatedCatalog, 'utf8');
          NODE

      - name: Format generated SchemaStore files
        working-directory: schemastore
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npx prettier \
            --write \
            --config .prettierrc.cjs \
            "src/schemas/json/${SCHEMA_FILE_NAME}" \
            "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}" \
            src/api/json/catalog.json

      - name: Push branch and optionally create SchemaStore pull request
        working-directory: schemastore
        env:
          GH_TOKEN: ${{ env.SCHEMASTORE_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH_NAME="podman-desktop-extension-schema-${RELEASE_TAG#v}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH_NAME}"

          git config user.name "podman-desktop-bot"
          git config user.email "podman-desktop-bot@users.noreply.github.com"

          git add "src/schemas/json/${SCHEMA_FILE_NAME}" "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}" src/api/json/catalog.json

          if git diff --cached --quiet; then
            echo "No changes detected for SchemaStore sync."
            exit 0
          fi

          git commit -m "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}"
          git push origin "${BRANCH_NAME}"

          if [ "${CREATE_PR}" != "true" ]; then
            echo "Skipping PR creation because create_pr=${CREATE_PR}"
            exit 0
          fi

          gh pr create \
            --repo "${SCHEMASTORE_REPOSITORY}" \
            --title "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}" \
            --body "Sync schema from ${SOURCE_REPOSITORY} ${RELEASE_TAG}. This updates the stable and version-specific schema files and appends the matching catalog.json versions entry." \
            --base "${SCHEMASTORE_BASE_BRANCH}" \
            --head "${BRANCH_NAME}"
