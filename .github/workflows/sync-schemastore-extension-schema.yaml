name: Sync extension schema to SchemaStore

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.28.2)'
        required: true
      schemastore_repository:
        description: 'SchemaStore repository to update (owner/repo)'
        required: false
        default: 'SchemaStore/schemastore'
      schemastore_base_branch:
        description: 'Base branch in the SchemaStore repository'
        required: false
        default: 'master'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      schemaMinorVersion: ${{ steps.version.outputs.schemaMinorVersion }}
      isOfficialRelease: ${{ steps.version.outputs.isOfficialRelease }}
    steps:
      - name: Resolve tag and release type
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${{ github.event.release.prerelease }}" = "true" ] || [ "${{ github.event.release.draft }}" = "true" ]; then
              echo "Skipping prerelease/draft release."
              echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          IS_OFFICIAL_RELEASE="true"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag '$TAG'. Expected stable semver format: v<major>.<minor>.<patch>."
            echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          SCHEMA_MINOR_VERSION="${MAJOR}.${MINOR}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "schemaMinorVersion=${SCHEMA_MINOR_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "isOfficialRelease=${IS_OFFICIAL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved schema source tag: ${TAG}"

  sync-schemastore:
    name: Sync schema to SchemaStore
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.isOfficialRelease == 'true'
    environment: ${{ github.event_name == 'release' && 'npmjs-publication' || '' }}
    permissions:
      contents: read
    env:
      SCHEMASTORE_TOKEN: ${{ secrets.PODMAN_DESKTOP_BOT_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SCHEMA_MINOR_VERSION: ${{ needs.prepare.outputs.schemaMinorVersion }}
      SCHEMA_FILE_NAME: podman-desktop-extension.json
      VERSIONED_SCHEMA_FILE_NAME: podman-desktop-extension-${{ needs.prepare.outputs.schemaMinorVersion }}.json
      SCHEMASTORE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_repository || 'SchemaStore/schemastore' }}
      SCHEMASTORE_BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_base_branch || 'master' }}
      SOURCE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.repository || 'podman-desktop/podman-desktop' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate local schema file exists
        run: |
          if [ ! -f "schemas/extension-schema.json" ]; then
            echo "Missing schemas/extension-schema.json in release tag ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout SchemaStore repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SCHEMASTORE_REPOSITORY }}
          token: ${{ env.SCHEMASTORE_TOKEN }}
          path: schemastore
          ref: ${{ env.SCHEMASTORE_BASE_BRANCH }}

      - name: Apply schema updates
        working-directory: schemastore
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts --no-save jsonc-parser

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { applyEdits, modify, parse } = require('jsonc-parser');

          const schemaDir = path.join('src', 'schemas', 'json');
          const stableFile = path.join(schemaDir, process.env.SCHEMA_FILE_NAME);
          const versionedFile = path.join(schemaDir, process.env.VERSIONED_SCHEMA_FILE_NAME);
          const incomingFile = path.join('..', 'schemas', 'extension-schema.json');
          const catalogFile = path.join('src', 'api', 'json', 'catalog.json');
          const schemaValidationFile = path.join('src', 'schema-validation.jsonc');
          const schemaMinorVersion = process.env.SCHEMA_MINOR_VERSION;
          const stableUrl = `https://www.schemastore.org/${process.env.SCHEMA_FILE_NAME}`;
          const versionedUrl = `https://www.schemastore.org/${process.env.VERSIONED_SCHEMA_FILE_NAME}`;
          const versionedId = `https://json.schemastore.org/${process.env.VERSIONED_SCHEMA_FILE_NAME}`;
          const jsonFormattingOptions = {
            insertSpaces: true,
            tabSize: 2,
            eol: '\n',
          };

          if (!fs.existsSync(incomingFile)) {
            throw new Error(`Missing source schema at ${incomingFile}`);
          }

          const incomingText = fs.readFileSync(incomingFile, 'utf8');
          const stableId = `https://json.schemastore.org/${process.env.SCHEMA_FILE_NAME}`;
          const stableSchema = JSON.parse(incomingText);
          stableSchema.$id = stableId;
          fs.writeFileSync(stableFile, `${JSON.stringify(stableSchema, null, 2)}\n`, 'utf8');

          const versionedSchema = structuredClone(stableSchema);
          versionedSchema.$id = versionedId;
          fs.writeFileSync(versionedFile, `${JSON.stringify(versionedSchema, null, 2)}\n`, 'utf8');

          let catalogText = fs.readFileSync(catalogFile, 'utf8');
          const catalog = JSON.parse(catalogText);
          if (!Array.isArray(catalog.schemas)) {
            throw new Error('Invalid SchemaStore catalog format: missing schemas array.');
          }
          const podmanEntryIndex = catalog.schemas.findIndex(schema => schema?.name === 'Podman Desktop Extension');
          if (podmanEntryIndex === -1) {
            throw new Error('Podman Desktop catalog entry is missing in SchemaStore.');
          }

          const applyCatalogEdit = (targetPath, value) => {
            const edits = modify(catalogText, targetPath, value, { formattingOptions: jsonFormattingOptions });
            catalogText = applyEdits(catalogText, edits);
          };

          applyCatalogEdit(['schemas', podmanEntryIndex, 'url'], stableUrl);
          const currentVersions = catalog.schemas[podmanEntryIndex]?.versions;
          if (!currentVersions || typeof currentVersions !== 'object') {
            applyCatalogEdit(['schemas', podmanEntryIndex, 'versions'], {});
          }
          applyCatalogEdit(['schemas', podmanEntryIndex, 'versions', schemaMinorVersion], versionedUrl);
          fs.writeFileSync(catalogFile, catalogText, 'utf8');

          let schemaValidationText = fs.readFileSync(schemaValidationFile, 'utf8');

          function applyJsoncEdit(targetPath, value) {
            const edits = modify(schemaValidationText, targetPath, value, {
              formattingOptions: jsonFormattingOptions,
            });
            schemaValidationText = applyEdits(schemaValidationText, edits);
          }

          function readSchemaValidationObject() {
            const errors = [];
            const parsed = parse(schemaValidationText, errors, {
              allowTrailingComma: true,
              disallowComments: false,
            });
            if (errors.length > 0) {
              throw new Error(`Could not parse schema-validation.jsonc (errors: ${errors.length})`);
            }
            return parsed;
          }

          function ensureSchemaValidationEntries(filename) {
            const schemaValidation = readSchemaValidationObject();
            const options = schemaValidation.options;
            if (!options || typeof options !== 'object') {
              throw new Error('Could not find options object in schema-validation.jsonc');
            }
            if (!options[filename]) {
              const podmanOptionKeys = Object.keys(options).filter(
                key => /^podman-desktop-extension(?:-[0-9]+\.[0-9]+)?\.json$/.test(key) && key !== filename,
              );
              const sourceFilename = podmanOptionKeys[podmanOptionKeys.length - 1] ?? 'package.json';
              const sourceOption = options[sourceFilename];
              if (!sourceOption) {
                throw new Error(`Could not find ${sourceFilename} options in schema-validation.jsonc`);
              }

              applyJsoncEdit(['options', filename], structuredClone(sourceOption));
            }

            const refreshedSchemaValidation = readSchemaValidationObject();
            const ajvNotStrictMode = refreshedSchemaValidation.ajvNotStrictMode;
            if (!Array.isArray(ajvNotStrictMode)) {
              throw new Error('Could not find ajvNotStrictMode array in schema-validation.jsonc');
            }
            if (!ajvNotStrictMode.includes(filename)) {
              applyJsoncEdit(['ajvNotStrictMode', ajvNotStrictMode.length], filename);
            }
          }

          const schemaTargets = [process.env.SCHEMA_FILE_NAME, process.env.VERSIONED_SCHEMA_FILE_NAME];
          for (const schemaFile of schemaTargets) {
            ensureSchemaValidationEntries(schemaFile);
          }
          fs.writeFileSync(schemaValidationFile, schemaValidationText, 'utf8');
          NODE

      - name: Format generated SchemaStore files
        working-directory: schemastore
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npx prettier \
            --write \
            --config .prettierrc.cjs \
            "src/schemas/json/${SCHEMA_FILE_NAME}" \
            "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}" \
            src/api/json/catalog.json \
            src/schema-validation.jsonc

      - name: Push branch and create SchemaStore pull request
        working-directory: schemastore
        env:
          GH_TOKEN: ${{ env.SCHEMASTORE_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH_NAME="podman-desktop-extension-schema-${RELEASE_TAG#v}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH_NAME}"

          git config user.name "podman-desktop-bot"
          git config user.email "podman-desktop-bot@users.noreply.github.com"

          git add "src/schemas/json/${SCHEMA_FILE_NAME}" "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}" src/api/json/catalog.json src/schema-validation.jsonc

          if git diff --cached --quiet; then
            echo "No changes detected for SchemaStore sync."
            exit 0
          fi

          git commit -m "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}"
          git push origin "${BRANCH_NAME}"

          gh pr create \
            --repo "${SCHEMASTORE_REPOSITORY}" \
            --title "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}" \
            --body "Sync schema from ${SOURCE_REPOSITORY} ${RELEASE_TAG}. This updates the stable and version-specific schema files and appends the matching catalog.json versions entry." \
            --base "${SCHEMASTORE_BASE_BRANCH}" \
            --head "${BRANCH_NAME}"
